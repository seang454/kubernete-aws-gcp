---
# ==============================================================================
# Kubernetes Observability & Monitoring - Global Variables
# ==============================================================================

# Environment
env_environment: "production"

# Target Namespace
k8s_monitoring_namespace: "monitoring"
kubeconfig_path: "/home/seang/.kube/config"

# ==============================================================================
# COMPONENT TOGGLES (Enable / Disable each suitable role)
# ==============================================================================
enable_prometheus_stack: true    # Metrics (Prometheus, Alertmanager, Grafana, Node Exporter, kube-state-metrics)
enable_loki_stack: true          # Logs (Loki + Promtail)
enable_jaeger: true              # Distributed Tracing (Jaeger all-in-one & query UI)
enable_opentelemetry: true       # OTel Collector (Universal pipeline for OTLP traces & metrics)
enable_grafana_dashboards: true  # Curated Dashboards (Cluster, Nodes, Pods, Logs, Traces)

# ==============================================================================
# INGRESS & DOMAINS (Uses ingress-nginx + Cert-Manager)
# ==============================================================================
ingress_class_name: "nginx"
cert_manager_cluster_issuer: "letsencrypt-prod"
acme_admin_email: "pengseangsim210@gmail.com"

# Domains
grafana_domain: "grafana.seang.shop"
jaeger_domain: "jaeger.seang.shop"
alertmanager_domain: "alertmanager.seang.shop"
prometheus_domain: "prometheus.seang.shop"

# Set true to enable ingress routes for UIs
enable_ingress: false            # Set true when DNS records point to ingress-nginx controller VIP
enable_tls: false                # Set true to generate Let's Encrypt TLS certs

# Grafana Admin Credentials
grafana_admin_user: "admin"
grafana_admin_password: "PrometheusGrafanaPass2026!"

# ==============================================================================
# STORAGE CONFIGURATION (Prometheus & Loki)
# Longhorn is the default distributed block storage on this cluster.
# ==============================================================================
default_storage_class: "longhorn"

prometheus_storage:
  storage_class:
    enabled: true
    name: "{{ default_storage_class }}"
    size: "15Gi"
  empty_dir:
    enabled: false
  retention: "15d"

loki_storage:
  storage_class:
    enabled: true
    name: "{{ default_storage_class }}"
    size: "15Gi"
  empty_dir:
    enabled: false
  retention: "168h"              # 7 days of logs

# ==============================================================================
# PORTS & SERVICE NAMES
# ==============================================================================
prometheus_service_port: 9090
alertmanager_service_port: 9093
grafana_service_port: 3000
loki_service_port: 3100
jaeger_query_port: 16686
jaeger_otlp_grpc_port: 4317
jaeger_otlp_http_port: 4318
otel_grpc_port: 4317
otel_http_port: 4318
node_exporter_port: 9100
kube_state_metrics_port: 8080

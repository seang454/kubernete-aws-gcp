---
# Observability Global Variables (Testing Configuration)

# Environment
env_environment: "testing"

# Network & VIP
observability_vip: "{{ vip_ip | default('10.146.0.11') }}"

# Domain & HTTPS Settings (Traefik Ingress + Cert-Manager)
grafana_domain: "grafana.seang.shop"
cert_manager_cluster_issuer: "letsencrypt-prod"
acme_admin_email: "pengseangsim210@gmail.com"
ingress_class_name: "traefik"

# Loki S3 Object Storage (MinIO) Settings
loki_use_s3: true
loki_s3_endpoint: "csp-minio.nextcloud-prod.svc.cluster.local:9000"
loki_s3_bucket: "loki-logs"
loki_s3_access_key: "minioadmin"
loki_s3_secret_key: "miniopass123"

# Ports
ceph_exporter_port: 9283
node_exporter_port: 9100
ganesha_exporter_port: 9587
ha_cluster_exporter_port: 9664
loki_push_port: 3100
grafana_web_port: 3000

# ==========================================
# KUBERNETES STORAGE CONFIGURATION
# Set `enabled: true` for the storage option you want to use.
# (Set `enabled: false` on all other storage options)
# ==========================================
k8s_monitoring_namespace: "monitoring"

# ------------------------------------------
# Prometheus Storage Configuration
# ------------------------------------------
prometheus_storage:
  # Option 1: StorageClass / Dynamic PVC (nfs-client, longhorn, local-path, standard, etc.)
  storage_class:
    enabled: true
    name: "nfs-client"
    size: "10Gi"

  # Option 2: HostPath (Direct directory mount on node disk)
  host_path:
    enabled: false
    path: "/var/lib/prometheus-data"

  # Option 3: EmptyDir (Ephemeral node disk storage)
  empty_dir:
    enabled: false

  # Option 4: EmptyDir Memory (Ephemeral RAM-backed storage)
  empty_dir_memory:
    enabled: false

  # Metric Retention Period
  retention: "24h"

# ------------------------------------------
# Loki Storage Configuration
# ------------------------------------------
loki_storage:
  # Option 1: StorageClass / Dynamic PVC (nfs-client, longhorn, local-path, standard, etc.)
  storage_class:
    enabled: true
    name: "nfs-client"
    size: "10Gi"

  # Option 2: HostPath (Direct directory mount on node disk)
  host_path:
    enabled: false
    path: "/var/lib/loki-data"

  # Option 3: EmptyDir (Ephemeral node disk storage)
  empty_dir:
    enabled: false

  # Option 4: EmptyDir Memory (Ephemeral RAM-backed storage)
  empty_dir_memory:
    enabled: false

# Legacy fallback compatibility
k8s_decoupled_storage_class: "{{ prometheus_storage.storage_class.name | default('nfs-client') }}"
prometheus_storage_size: "{{ prometheus_storage.storage_class.size | default('10Gi') }}"
loki_storage_size: "{{ loki_storage.storage_class.size | default('10Gi') }}"
prometheus_retention: "{{ prometheus_storage.retention | default('24h') }}"

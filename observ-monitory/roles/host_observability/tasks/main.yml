---
# tasks file for host_observability (haproxy-1..3)

- name: Install node_exporter for OS hardware metrics
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present
    update_cache: true

- name: Ensure node_exporter service is started and enabled
  ansible.builtin.systemd:
    name: prometheus-node-exporter
    state: started
    enabled: true

- name: Ensure /etc/apt/keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Remove stale invalid Grafana key from trusted.gpg.d if present
  ansible.builtin.file:
    path: /etc/apt/trusted.gpg.d/grafana.gpg
    state: absent

- name: Download Grafana GPG key and de-armor into keyring
  ansible.builtin.shell: |
    curl -fsSL https://apt.grafana.com/gpg.key | gpg --dearmor -o /etc/apt/keyrings/grafana.gpg
  args:
    creates: /etc/apt/keyrings/grafana.gpg

- name: Add Grafana APT Repository with signed-by
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/grafana.gpg] https://apt.grafana.com stable main"
    filename: grafana
    state: present
    update_cache: true

- name: Install Grafana Alloy
  ansible.builtin.apt:
    name: alloy
    state: present
    update_cache: true

- name: Deploy Grafana Alloy Config (/etc/alloy/config.alloy)
  ansible.builtin.template:
    src: config.alloy.j2
    dest: /etc/alloy/config.alloy
    owner: root
    group: root
    mode: '0644'
  notify: Restart Alloy

- name: Ensure Grafana Alloy service is started and enabled
  ansible.builtin.systemd:
    name: alloy
    state: started
    enabled: true

---
# ==============================================================================
# Master Observability Verification Playbook
# Verifies that Metrics, Logs, Traces, and UI components are 100% operational
# ==============================================================================

- name: Verify Kubernetes Observability Stack
  hosts: k8s_control_plane[0]
  become: false
  tasks:
    - name: Fetch all Pods in monitoring namespace
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ k8s_monitoring_namespace | default('monitoring') }}"
      register: monitoring_pods

    - name: Display Running Pods
      ansible.builtin.debug:
        msg: >-
          {{
            monitoring_pods.resources
            | map(attribute='metadata.name')
            | list
          }}

    - name: Verify Prometheus StatefulSet Pod
      ansible.builtin.assert:
        that:
          - (monitoring_pods.resources | selectattr('metadata.name', 'search', 'prometheus-prometheus') | list | length) > 0
        fail_msg: "Prometheus pod is not running in {{ k8s_monitoring_namespace }}"
      when: enable_prometheus_stack | default(true)

    - name: Verify Alertmanager StatefulSet Pod
      ansible.builtin.assert:
        that:
          - (monitoring_pods.resources | selectattr('metadata.name', 'search', 'alertmanager') | list | length) > 0
        fail_msg: "Alertmanager pod is not running in {{ k8s_monitoring_namespace }}"
      when: enable_prometheus_stack | default(true)

    - name: Verify Grafana Deployment Pod
      ansible.builtin.assert:
        that:
          - (monitoring_pods.resources | selectattr('metadata.name', 'search', 'grafana') | list | length) > 0
        fail_msg: "Grafana pod is not running in {{ k8s_monitoring_namespace }}"
      when: enable_prometheus_stack | default(true)

    - name: Verify Node Exporter DaemonSet Pods
      ansible.builtin.assert:
        that:
          - (monitoring_pods.resources | selectattr('metadata.name', 'search', 'node-exporter') | list | length) >= 7
        fail_msg: "Node Exporter is not running on all nodes in {{ k8s_monitoring_namespace }}"
      when: enable_prometheus_stack | default(true)

    - name: Verify kube-state-metrics Deployment Pod
      ansible.builtin.assert:
        that:
          - (monitoring_pods.resources | selectattr('metadata.name', 'search', 'kube-state-metrics') | list | length) > 0
        fail_msg: "kube-state-metrics pod is not running in {{ k8s_monitoring_namespace }}"
      when: enable_prometheus_stack | default(true)

    - name: Verify Loki StatefulSet Pod
      ansible.builtin.assert:
        that:
          - (monitoring_pods.resources | selectattr('metadata.name', 'search', loki_service_name | default('loki')) | list | length) > 0
        fail_msg: "Loki pod is not running in {{ k8s_monitoring_namespace }}"
      when: enable_loki_stack | default(true)

    - name: Verify Promtail DaemonSet Pods
      ansible.builtin.assert:
        that:
          - (monitoring_pods.resources | selectattr('metadata.name', 'search', 'promtail') | list | length) >= 7
        fail_msg: "Promtail is not running on all nodes in {{ k8s_monitoring_namespace }}"
      when:
        - enable_loki_stack | default(true)
        - not (enable_alloy | default(true))

    - name: Verify Grafana Alloy DaemonSet Pods
      ansible.builtin.assert:
        that:
          - (monitoring_pods.resources | selectattr('metadata.name', 'search', 'alloy') | list | length) > 0
        fail_msg: "Grafana Alloy is not running in {{ k8s_monitoring_namespace }}"
      when: enable_alloy | default(true)

    - name: Verify Jaeger Deployment Pod
      ansible.builtin.assert:
        that:
          - (monitoring_pods.resources | selectattr('metadata.name', 'search', jaeger_service_name | default('jaeger')) | list | length) > 0
        fail_msg: "Jaeger pod is not running in {{ k8s_monitoring_namespace }}"
      when: enable_jaeger | default(true)

    - name: Verify Tempo Deployment Pod
      ansible.builtin.assert:
        that:
          - (monitoring_pods.resources | selectattr('metadata.name', 'search', tempo_service_name | default('tempo')) | list | length) > 0
        fail_msg: "Tempo pod is not running in {{ k8s_monitoring_namespace }}"
      when: enable_tempo | default(true)

    - name: Verify Pyroscope Deployment Pod
      ansible.builtin.assert:
        that:
          - (monitoring_pods.resources | selectattr('metadata.name', 'search', pyroscope_service_name | default('pyroscope')) | list | length) > 0
        fail_msg: "Pyroscope pod is not running in {{ k8s_monitoring_namespace }}"
      when: enable_pyroscope | default(true)

    - name: Verify OpenTelemetry Collector Deployment Pod
      ansible.builtin.assert:
        that:
          - (monitoring_pods.resources | selectattr('metadata.name', 'search', 'otel-collector') | list | length) > 0
        fail_msg: "OpenTelemetry Collector pod is not running in {{ k8s_monitoring_namespace }}"
      when: enable_opentelemetry | default(false)

    - name: Fetch Pods in OpenSearch namespace
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ opensearch_namespace | default('opensearch') }}"
      register: opensearch_pods
      when: enable_opensearch | default(true)

    - name: Verify OpenSearch Pod
      ansible.builtin.assert:
        that:
          - (opensearch_pods.resources | selectattr('metadata.name', 'search', opensearch_service_name | default('opensearch')) | list | length) > 0
        fail_msg: "OpenSearch pod is not running in {{ opensearch_namespace | default('opensearch') }}"
      when: enable_opensearch | default(true)

    - name: Verify OpenSearch Dashboards Pod
      ansible.builtin.assert:
        that:
          - (opensearch_pods.resources | selectattr('metadata.name', 'search', 'dashboards') | list | length) > 0
        fail_msg: "OpenSearch Dashboards pod is not running in {{ opensearch_namespace | default('opensearch') }}"
      when:
        - enable_opensearch | default(true)
        - enable_opensearch_dashboards | default(true)

    - name: Fetch Pods in Kafka namespace
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ kafka_namespace | default('kafka') }}"
      register: kafka_pods
      when: (enable_kafka | default(false)) or (enable_schema_registry | default(false)) or (enable_debezium | default(false)) or (enable_kafka_ui | default(false))

    - name: Verify Confluent Kafka Cluster Pods
      ansible.builtin.assert:
        that:
          - (kafka_pods.resources | selectattr('metadata.name', 'search', item.name) | list | length) > 0
        fail_msg: "Kafka broker pod {{ item.name }} must be running in {{ kafka_namespace | default('kafka') }}"
      loop: "{{ kafka_nodes }}"
      when: enable_kafka | default(false)

    - name: Verify Schema Registry Pod
      ansible.builtin.assert:
        that:
          - (kafka_pods.resources | selectattr('metadata.name', 'search', schema_registry_service_name | default('schema-registry-itp')) | list | length) > 0
        fail_msg: "Schema Registry pod is not running in {{ kafka_namespace | default('kafka') }}"
      when: enable_schema_registry | default(false)

    - name: Verify Debezium Kafka Connect Pod
      ansible.builtin.assert:
        that:
          - (kafka_pods.resources | selectattr('metadata.name', 'search', debezium_service_name | default('debezium-kafka-connect-itp')) | list | length) > 0
        fail_msg: "Debezium Kafka Connect pod is not running in {{ kafka_namespace | default('kafka') }}"
      when: enable_debezium | default(false)

    - name: Verify Kafka UI Pod
      ansible.builtin.assert:
        that:
          - (kafka_pods.resources | selectattr('metadata.name', 'search', kafka_ui_service_name | default('kafka-ui-itp')) | list | length) > 0
        fail_msg: "Kafka UI pod is not running in {{ kafka_namespace | default('kafka') }}"
      when: enable_kafka_ui | default(false)

    - name: Verify Grafana Gateway API HTTPRoute
      kubernetes.core.k8s_info:
        api_version: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        namespace: "{{ k8s_monitoring_namespace | default('monitoring') }}"
        name: grafana-httproute
      register: grafana_httproute
      when:
        - enable_gateway_tls | default(true)
        - enable_grafana_route | default(true)
        - enable_prometheus_stack | default(true)

    - name: Assert Grafana HTTPRoute Exists
      ansible.builtin.assert:
        that:
          - grafana_httproute.resources | length > 0
        fail_msg: "Grafana HTTPRoute was not found in namespace {{ k8s_monitoring_namespace | default('monitoring') }}"
      when:
        - enable_gateway_tls | default(true)
        - enable_grafana_route | default(true)
        - enable_prometheus_stack | default(true)

    - name: Verify Prometheus Gateway API HTTPRoute
      kubernetes.core.k8s_info:
        api_version: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        namespace: "{{ k8s_monitoring_namespace | default('monitoring') }}"
        name: prometheus-httproute
      register: prometheus_httproute
      when:
        - enable_gateway_tls | default(true)
        - enable_prometheus_route | default(true)
        - enable_prometheus_stack | default(true)

    - name: Assert Prometheus HTTPRoute Exists
      ansible.builtin.assert:
        that:
          - prometheus_httproute.resources | length > 0
        fail_msg: "Prometheus HTTPRoute was not found in namespace {{ k8s_monitoring_namespace | default('monitoring') }}"
      when:
        - enable_gateway_tls | default(true)
        - enable_prometheus_route | default(true)
        - enable_prometheus_stack | default(true)

    - name: Verify OpenSearch Dashboards Gateway API HTTPRoute
      kubernetes.core.k8s_info:
        api_version: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        namespace: "{{ opensearch_namespace | default('opensearch') }}"
        name: opensearch-dashboards-httproute
      register: os_httproute
      when:
        - enable_gateway_tls | default(true)
        - enable_opensearch_route | default(true)
        - enable_opensearch | default(true)
        - enable_opensearch_dashboards | default(true)

    - name: Assert OpenSearch Dashboards HTTPRoute Exists
      ansible.builtin.assert:
        that:
          - os_httproute.resources | length > 0
        fail_msg: "OpenSearch Dashboards HTTPRoute was not found in namespace {{ opensearch_namespace | default('opensearch') }}"
      when:
        - enable_gateway_tls | default(true)
        - enable_opensearch_route | default(true)
        - enable_opensearch | default(true)
        - enable_opensearch_dashboards | default(true)

    - name: Verify Jaeger UI Gateway API HTTPRoute
      kubernetes.core.k8s_info:
        api_version: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        namespace: "{{ k8s_monitoring_namespace | default('monitoring') }}"
        name: jaeger-httproute
      register: jaeger_httproute
      when:
        - enable_gateway_tls | default(true)
        - enable_jaeger_route | default(true)
        - enable_jaeger | default(true)

    - name: Assert Jaeger UI HTTPRoute Exists
      ansible.builtin.assert:
        that:
          - jaeger_httproute.resources | length > 0
        fail_msg: "Jaeger UI HTTPRoute was not found in namespace {{ k8s_monitoring_namespace | default('monitoring') }}"
      when:
        - enable_gateway_tls | default(true)
        - enable_jaeger_route | default(true)
        - enable_jaeger | default(true)

    - name: Display Final Verification Summary
      ansible.builtin.debug:
        msg:
          - "======================================================================="
          - "🎉 VERIFICATION COMPLETE: ALL OBSERVABILITY & STREAMING COMPONENTS ARE READY!"
          - "• Metrics Pipeline: Prometheus, Alertmanager, Node Exporter, kube-state-metrics, cAdvisor"
          - "• Logs Pipeline: Loki, OpenSearch"
          - "• Universal Shipper: Grafana Alloy"
          - "• Traces Pipeline: Jaeger (OTLP via Alloy)"
          - "• Streaming Buffer: Confluent Kafka 3-Node KRaft ({{ 'Enabled' if (enable_kafka | default(false)) else 'Disabled' }})"
          - "• Schema Registry: Confluent Schema Registry ({{ 'Enabled' if (enable_schema_registry | default(false)) else 'Disabled' }})"
          - "• Database CDC: Debezium Kafka Connect ({{ 'Enabled' if (enable_debezium | default(false)) else 'Disabled' }})"
          - "• Kafka UI: Provectus Kafka UI Dashboard ({{ 'Enabled' if (enable_kafka_ui | default(false)) else 'Disabled' }})"
          - "• Visualization UIs: Grafana & OpenSearch Dashboards"
          - "• HTTPS Gateway: Traefik Gateway API HTTPRoutes (Grafana, Prometheus, OpenSearch, Jaeger)"
          - "======================================================================="

---
# ==============================================================================
# Master Observability Verification Playbook
# Verifies that Metrics, Logs, Traces, and UI components are 100% operational
# ==============================================================================

- name: Verify Kubernetes Observability Stack
  hosts: k8s_control_plane[0]
  become: false
  tasks:
    - name: Fetch all Pods in monitoring namespace
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ k8s_monitoring_namespace | default('monitoring') }}"
      register: monitoring_pods

    - name: Display Running Pods
      ansible.builtin.debug:
        msg: >-
          {{
            monitoring_pods.resources
            | map(attribute='metadata.name')
            | list
          }}

    - name: Verify Prometheus StatefulSet Pod
      ansible.builtin.assert:
        that:
          - (monitoring_pods.resources | selectattr('metadata.name', 'search', 'prometheus-prometheus') | list | length) > 0
        fail_msg: "Prometheus pod is not running in {{ k8s_monitoring_namespace }}"
      when: enable_prometheus_stack | default(true)

    - name: Verify Alertmanager StatefulSet Pod
      ansible.builtin.assert:
        that:
          - (monitoring_pods.resources | selectattr('metadata.name', 'search', 'alertmanager') | list | length) > 0
        fail_msg: "Alertmanager pod is not running in {{ k8s_monitoring_namespace }}"
      when: enable_prometheus_stack | default(true)

    - name: Verify Grafana Deployment Pod
      ansible.builtin.assert:
        that:
          - (monitoring_pods.resources | selectattr('metadata.name', 'search', 'grafana') | list | length) > 0
        fail_msg: "Grafana pod is not running in {{ k8s_monitoring_namespace }}"
      when: enable_prometheus_stack | default(true)

    - name: Verify Node Exporter DaemonSet Pods
      ansible.builtin.assert:
        that:
          - (monitoring_pods.resources | selectattr('metadata.name', 'search', 'node-exporter') | list | length) >= 7
        fail_msg: "Node Exporter is not running on all nodes in {{ k8s_monitoring_namespace }}"
      when: enable_prometheus_stack | default(true)

    - name: Verify kube-state-metrics Deployment Pod
      ansible.builtin.assert:
        that:
          - (monitoring_pods.resources | selectattr('metadata.name', 'search', 'kube-state-metrics') | list | length) > 0
        fail_msg: "kube-state-metrics pod is not running in {{ k8s_monitoring_namespace }}"
      when: enable_prometheus_stack | default(true)

    - name: Verify Loki StatefulSet Pod
      ansible.builtin.assert:
        that:
          - (monitoring_pods.resources | selectattr('metadata.name', 'search', 'loki') | list | length) > 0
        fail_msg: "Loki pod is not running in {{ k8s_monitoring_namespace }}"
      when: enable_loki_stack | default(true)

    - name: Verify Promtail DaemonSet Pods
      ansible.builtin.assert:
        that:
          - (monitoring_pods.resources | selectattr('metadata.name', 'search', 'promtail') | list | length) >= 7
        fail_msg: "Promtail is not running on all nodes in {{ k8s_monitoring_namespace }}"
      when: enable_loki_stack | default(true)

    - name: Verify Jaeger Deployment Pod
      ansible.builtin.assert:
        that:
          - (monitoring_pods.resources | selectattr('metadata.name', 'search', 'jaeger') | list | length) > 0
        fail_msg: "Jaeger pod is not running in {{ k8s_monitoring_namespace }}"
      when: enable_jaeger | default(true)

    - name: Verify OpenTelemetry Collector Deployment Pod
      ansible.builtin.assert:
        that:
          - (monitoring_pods.resources | selectattr('metadata.name', 'search', 'otel-collector') | list | length) > 0
        fail_msg: "OpenTelemetry Collector pod is not running in {{ k8s_monitoring_namespace }}"
      when: enable_opentelemetry | default(true)

    - name: Display Final Verification Summary
      ansible.builtin.debug:
        msg:
          - "======================================================================="
          - "🎉 VERIFICATION COMPLETE: ALL OBSERVABILITY COMPONENTS ARE READY!"
          - "• Metrics Pipeline: Prometheus, Alertmanager, Node Exporter, kube-state-metrics, cAdvisor"
          - "• Logs Pipeline: Loki, Promtail"
          - "• Traces Pipeline: OpenTelemetry Collector, Jaeger"
          - "• Visualization UI: Grafana"
          - "======================================================================="

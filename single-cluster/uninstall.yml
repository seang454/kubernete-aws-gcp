---
# ==============================================================================
# Master Observability Cleanup & Teardown Playbook
# Restores Cluster back to clean state
# ==============================================================================

- name: Teardown Observability Stack
  hosts: k8s_control_plane[0]
  become: false
  tasks:
    - name: Remove Prometheus Stack Helm Release
      kubernetes.core.helm:
        name: prometheus
        release_namespace: "{{ k8s_monitoring_namespace | default('monitoring') }}"
        state: absent
      failed_when: false

    - name: Remove Loki Stack Helm Release
      kubernetes.core.helm:
        name: loki
        release_namespace: "{{ k8s_monitoring_namespace | default('monitoring') }}"
        state: absent
      failed_when: false

    - name: Remove Grafana Alloy Helm Release
      kubernetes.core.helm:
        name: alloy
        release_namespace: "{{ k8s_monitoring_namespace | default('monitoring') }}"
        state: absent
      failed_when: false

    - name: Remove OpenSearch Dashboards Helm Release
      kubernetes.core.helm:
        name: opensearch-dashboards
        release_namespace: "{{ opensearch_namespace | default('opensearch') }}"
        state: absent
      failed_when: false

    - name: Remove OpenSearch Helm Release
      kubernetes.core.helm:
        name: "{{ opensearch_cluster_name | default('opensearch-cluster') }}"
        release_namespace: "{{ opensearch_namespace | default('opensearch') }}"
        state: absent
      failed_when: false

    - name: Delete opensearch Namespace
      kubernetes.core.k8s:
        name: "{{ opensearch_namespace | default('opensearch') }}"
        api_version: v1
        kind: Namespace
        state: absent
    - name: Delete Kafka UI Resources
      kubernetes.core.k8s:
        name: "{{ kafka_ui_service_name | default('kafka-ui-itp') }}"
        namespace: "{{ kafka_namespace | default('kafka') }}"
        kind: "{{ item }}"
        state: absent
      loop:
        - Deployment
        - Service
      failed_when: false

    - name: Delete Debezium Connect Resources
      kubernetes.core.k8s:
        name: "{{ debezium_service_name | default('debezium-kafka-connect-itp') }}"
        namespace: "{{ kafka_namespace | default('kafka') }}"
        kind: "{{ item }}"
        state: absent
      loop:
        - Deployment
        - Service
      failed_when: false

    - name: Delete Schema Registry Resources
      kubernetes.core.k8s:
        name: "{{ schema_registry_service_name | default('schema-registry-itp') }}"
        namespace: "{{ kafka_namespace | default('kafka') }}"
        kind: "{{ item }}"
        state: absent
      loop:
        - Deployment
        - Service
      failed_when: false

    - name: Delete Confluent Kafka Broker StatefulSets
      kubernetes.core.k8s:
        name: "{{ item.name }}"
        namespace: "{{ kafka_namespace | default('kafka') }}"
        kind: StatefulSet
        state: absent
      loop: "{{ kafka_nodes }}"
      failed_when: false

    - name: Delete Confluent Kafka Broker Services
      kubernetes.core.k8s:
        name: "{{ item.name }}"
        namespace: "{{ kafka_namespace | default('kafka') }}"
        kind: Service
        state: absent
      loop: "{{ kafka_nodes }}"
      failed_when: false

    - name: Delete Shared Kafka Cluster Service
      kubernetes.core.k8s:
        name: kafka
        namespace: "{{ kafka_namespace | default('kafka') }}"
        kind: Service
        state: absent
      failed_when: false

    - name: Delete kafka Namespace
      kubernetes.core.k8s:
        name: "{{ kafka_namespace | default('kafka') }}"
        api_version: v1
        kind: Namespace
        state: absent
      failed_when: false

    - name: Delete Jaeger Deployment & Service
      kubernetes.core.k8s:
        name: "{{ jaeger_service_name | default('jaeger') }}"
        namespace: "{{ k8s_monitoring_namespace | default('monitoring') }}"
        kind: "{{ item }}"
        state: absent
      loop:
        - Deployment
        - Service
      failed_when: false

    - name: Delete OpenTelemetry Collector Deployment & Service
      kubernetes.core.k8s:
        name: otel-collector
        namespace: "{{ k8s_monitoring_namespace | default('monitoring') }}"
        kind: "{{ item }}"
        state: absent
      loop:
        - Deployment
        - Service
        - ConfigMap
      failed_when: false

    # --------------------------------------------------------------------------
    # Teardown Gateway API, Cloudflare Tunnel & TLS Resources
    # --------------------------------------------------------------------------
    - name: Delete Grafana Gateway API HTTPRoute
      kubernetes.core.k8s:
        api_version: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        name: grafana-httproute
        namespace: "{{ k8s_monitoring_namespace | default('monitoring') }}"
        state: absent
      failed_when: false

    - name: Delete OpenSearch Dashboards Gateway API HTTPRoute
      kubernetes.core.k8s:
        api_version: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        name: opensearch-dashboards-httproute
        namespace: "{{ opensearch_namespace | default('opensearch') }}"
        state: absent
      failed_when: false

    - name: Delete cloudflared Deployment in traefik namespace
      kubernetes.core.k8s:
        api_version: apps/v1
        kind: Deployment
        name: cloudflared
        namespace: "{{ traefik_namespace | default('traefik') }}"
        state: absent
      failed_when: false

    - name: Delete Cloudflare Tunnel Secrets and ConfigMap
      kubernetes.core.k8s:
        api_version: v1
        kind: "{{ item.kind }}"
        name: "{{ item.name }}"
        namespace: "{{ traefik_namespace | default('traefik') }}"
        state: absent
      loop:
        - { kind: "Secret", name: "cloudflare-tunnel-token" }
        - { kind: "Secret", name: "cloudflared-credentials" }
        - { kind: "ConfigMap", name: "cloudflared-config" }
      failed_when: false

    - name: Delete Traefik Wildcard TLS Certificate
      kubernetes.core.k8s:
        api_version: cert-manager.io/v1
        kind: Certificate
        name: traefik-wildcard-cert
        namespace: "{{ traefik_namespace | default('traefik') }}"
        state: absent
      failed_when: false

    - name: Delete Let's Encrypt Cloudflare ClusterIssuer
      kubernetes.core.k8s:
        api_version: cert-manager.io/v1
        kind: ClusterIssuer
        name: "{{ cloudflare_cluster_issuer_name | default('letsencrypt-cloudflare') }}"
        state: absent
      failed_when: false

    - name: Delete Cloudflare API Token Secret in cert-manager
      kubernetes.core.k8s:
        api_version: v1
        kind: Secret
        name: cloudflare-api-token-secret
        namespace: "{{ cert_manager_namespace | default('cert-manager') }}"
        state: absent
      failed_when: false

    - name: Force delete any stuck terminating pods in monitoring namespace
      ansible.builtin.shell: |
        kubectl get pods -n {{ k8s_monitoring_namespace | default('monitoring') }} --no-headers 2>/dev/null | grep Terminating | awk '{print $1}' | xargs -r kubectl delete pod -n {{ k8s_monitoring_namespace | default('monitoring') }} --force --grace-period=0
      failed_when: false

    - name: Delete monitoring Namespace
      kubernetes.core.k8s:
        name: "{{ k8s_monitoring_namespace | default('monitoring') }}"
        api_version: v1
        kind: Namespace
        state: absent
      failed_when: false

    - name: Display Teardown Summary
      ansible.builtin.debug:
        msg:
          - "======================================================================="
          - "🧹 TEARDOWN COMPLETE: ALL OBSERVABILITY COMPONENTS REMOVED!"
          - "• Namespace '{{ k8s_monitoring_namespace | default('monitoring') }}' deleted"
          - "• All Helm releases, Pods, Services, and PVCs freed"
          - "======================================================================="

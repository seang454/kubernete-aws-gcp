---
# tasks file for schema_registry (Confluent CP-Schema-Registry 7.8.0)

- name: Ensure Kafka namespace exists
  kubernetes.core.k8s:
    name: "{{ kafka_namespace | default('kafka') }}"
    api_version: v1
    kind: Namespace
    state: present

- name: Deploy Schema Registry Manifests
  kubernetes.core.k8s:
    definition: "{{ lookup('template', 'schema-registry.yaml.j2') | from_yaml_all | list }}"
    state: present

- name: Wait for Schema Registry Pod to be Ready
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ kafka_namespace | default('kafka') }}"
    label_selectors:
      - "app.kubernetes.io/name={{ schema_registry_service_name | default('schema-registry-itp') }}"
  register: sr_pod
  until: >
    sr_pod.resources | length > 0 and
    (sr_pod.resources[0].status.containerStatuses[0].ready | default(false))
  retries: 30
  delay: 10

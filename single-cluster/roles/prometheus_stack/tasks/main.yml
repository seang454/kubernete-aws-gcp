---
# tasks file for prometheus_stack

- name: Install Python dependencies for Kubernetes Ansible modules via APT
  ansible.builtin.apt:
    name:
      - python3-kubernetes
      - python3-yaml
      - python3-jsonpatch
    state: present
    update_cache: true
  become: true

- name: Add prometheus-community Helm Repository
  kubernetes.core.helm_repository:
    name: prometheus-community
    repo_url: https://prometheus-community.github.io/helm-charts

- name: Ensure monitoring namespace exists
  kubernetes.core.k8s:
    name: "{{ k8s_monitoring_namespace }}"
    api_version: v1
    kind: Namespace
    state: present

- name: Create etcd client cert Secret in monitoring namespace
  ansible.builtin.shell: |
    kubectl create secret generic etcd-client-cert -n {{ k8s_monitoring_namespace }} \
      --from-file=etcd-ca=/etc/ssl/etcd/ssl/ca.pem \
      --from-file=etcd-client=/etc/ssl/etcd/ssl/admin-master01.pem \
      --from-file=etcd-client-key=/etc/ssl/etcd/ssl/admin-master01-key.pem \
      --dry-run=client -o yaml | kubectl apply -f -
  become: true

- name: Render Prometheus Values File
  ansible.builtin.template:
    src: prometheus-values.yaml.j2
    dest: /tmp/prometheus-values.yaml
    mode: "0644"

- name: Deploy kube-prometheus-stack via Helm
  kubernetes.core.helm:
    name: prometheus
    chart_ref: prometheus-community/kube-prometheus-stack
    release_namespace: "{{ k8s_monitoring_namespace }}"
    values_files:
      - /tmp/prometheus-values.yaml
    state: present
    wait: true
    timeout: "600s"

- name: Wait for Prometheus Pod to be Ready
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ k8s_monitoring_namespace }}"
    label_selectors:
      - "app.kubernetes.io/name=prometheus"
  register: prom_pod
  until: >
    prom_pod.resources | length > 0 and
    (prom_pod.resources[0].status.containerStatuses[0].ready | default(false))
  retries: 30
  delay: 10

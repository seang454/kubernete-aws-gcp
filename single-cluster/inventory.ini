# ==============================================================================
# Kubernetes Observability Cluster Inventory
# Hybrid Cloud: GCP (master01, master02) + AWS (master03, worker01..04)
# ==============================================================================

[k8s_control_plane]
master01 ansible_host=34.81.69.217 internal_ip=10.0.0.1
master02 ansible_host=35.221.163.243 internal_ip=10.0.0.2
master03 ansible_host=18.139.126.219 internal_ip=10.0.0.3

[k8s_nodes]
worker01 ansible_host=47.130.201.197 internal_ip=10.0.0.4
worker02 ansible_host=54.251.232.35 internal_ip=10.0.0.5
worker03 ansible_host=52.77.127.1 internal_ip=10.0.0.6
worker04 ansible_host=13.215.33.155 internal_ip=10.0.0.7

[k8s_cluster:children]
k8s_control_plane
k8s_nodes

[all:vars]
ansible_user=seang
ansible_ssh_private_key_file=/home/seang/.ssh/id_rsa
ansible_python_interpreter=/usr/bin/python3
# [CLIENT-SIDE KEEP-ALIVE]: Pings nodes every 30s to prevent NAT connection drop
ansible_ssh_extra_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes'
